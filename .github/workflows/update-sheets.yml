name: Update stock sheets

# 毎日 17:00 JST に tickers.csv の全銘柄をスプレッドシートへ書き出す。
# 銘柄の追加は tickers.csv を編集するだけ (このワークフローの変更は不要)。
# GitHub Actions の cron は UTC のため 17:00 JST = 08:00 UTC。
# (J-Quants の株価四本値は 16:30 JST 頃更新のため、その後に取得できるよう 17:00 に設定)
on:
  schedule:
    - cron: "0 8 * * 1-5"   # 月〜金 08:00 UTC = 17:00 JST
  workflow_dispatch:          # 手動実行も可

concurrency:
  group: update-sheets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update spreadsheet
        env:
          # リポジトリの Settings > Secrets に登録したサービスアカウント鍵 (JSON 全体)。
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # 任意で上書き。未設定ならコード内の既定 ID を使用。
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          # J-Quants V2 の API キー (x-api-key)。
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python -m sheets_stock.update_job
